[package]
name = "rivetx-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["native"]
native = [
    "mysql",
    "dep:libc",
    "dep:rlimit",
    "dep:backtrace",
    "dep:tokio",
    "dep:moka",
    "dep:awaitgroup",
    "dep:arc-swap",
]
mysql = ["dep:mysql_common"]
wasm = []

[dependencies]
tokio = { version = "1.32.0", optional = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
mysql_common = { version = "0.32.4", optional = true }
serde_json = "1.0.114"
futures = "0.3.30"
serde = { version = "1.0", features = ["derive", "rc"] }
base64 = "0.22.0"
lazy_static = "1.4.0"
log = "0.4"
async-channel = "1.8.0"
anyhow = { git = "https://github.com/yefy/anyhow.git" }
awaitgroup = { git = "https://github.com/yefy/awaitgroup.git", optional = true }
linked-hash-map = "0.5.6"
scopeguard = "1.2.0"
chrono = "0.4.38"
backtrace = { version = "0.3.67", optional = true }
libc = { version = "0.2.153", optional = true }
rlimit = { version = "0.9.0", optional = true }
arc-swap = { version = "1.9.2", optional = true }
toml = "0.5.10"
serde_yaml = "0.9.34+deprecated"
moka = { version = "0.12.10", optional = true, features = ["sync", "future"] }

[package]
name = "rivetx-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.32.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
mysql_common = "0.32.4"
serde_json = "1.0.114"
futures = "0.3.30"
serde = { version = "1.0", features = ["derive", "rc"] }
base64 = "0.22.0"
lazy_static = "1.4.0"
log = "0.4"
async-channel = "1.8.0"
#anyhow = "1.0.102"
anyhow = { git = "https://github.com/yefy/anyhow.git" }
#anyhow = { path = "../anyhow" }
awaitgroup = { git = "https://github.com/yefy/awaitgroup.git" }
linked-hash-map = "0.5.6"
scopeguard = "1.2.0"
chrono = "0.4.38"
backtrace = "0.3.67"
libc = "0.2.153"
rlimit = "0.9.0"
arc-swap = "1.9.2"
toml = "0.5.10"

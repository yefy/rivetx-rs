# log4rs.yaml
refresh_rate: 10 seconds
# appender
appenders:
  stdout:
    kind: console
    encoder:
      kind: pattern
      pattern: "{d(%Y-%m-%d %H:%M:%S)(utc)} {h({l:<6})} {t} {f}:{L} {m}{n}"
  file:
    kind: file
    path: "logs/rivetx.log"
    encoder:
      kind: pattern
      pattern: "{d(%Y-%m-%d %H:%M:%S)(utc)} {h({l:<6})} {t} {f}:{L} {m}{n}"
    append: true
root:
  level: info
  multiline: false
  appenders:
    - stdout
    - file

loggers:
  main:
    level: trace
    additive: true
    multiline: false
  test:
    level: trace
    additive: true
    multiline: false
  rivetx_sql:
    level: trace
    additive: true
    multiline: false



# error warn info  debug  trace
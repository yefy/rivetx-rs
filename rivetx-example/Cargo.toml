[package]
name = "rivetx-example"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rivetx-example"
path = "src/main.rs"


[dependencies]
rivetx-sql-derive = { path = "../rivetx-sql-derive" }
rivetx-sql = { path = "../rivetx-sql" }
rivetx-core = { path = "../rivetx-core" }
mysql_async = "0.34.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive", "rc"] }
#anyhow = "1.0.102"
anyhow = { git = "https://github.com/yefy/anyhow.git"}
#anyhow = { path = "../anyhow" }
log4rs = { git = "https://github.com/yefy/log4rs.git" }
scopeguard = "1.2.0"
moka = { version = "0.12.10", features = ["sync", "future"] }
linked-hash-map = "0.5.6"
axum = "0.8.4"


[dependencies.serde_json]
version = "1"
features = [ "arbitrary_precision", "preserve_order" ]

[dependencies.log]
version = "0.4.20"
features = ["std"]
